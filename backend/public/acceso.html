<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ASIR - Acceso a la Plataforma</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="font-sans min-h-screen flex items-center justify-center p-4 bg-slate-50 text-slate-800">
    <div
      class="w-full max-w-md bg-white border border-slate-200 rounded-xl p-6 sm:p-8 shadow-sm">
      <div class="text-center mb-6">
        <img
          src="/img/logo-asir.png"
          alt="Logo ASIR"
          class="w-[150px] h-[150px] mx-auto rounded-lg object-contain shrink-0"
        />
        <h1 class="text-2xl font-extrabold text-slate-800 tracking-wider mt-2">
          ASIR
        </h1>
      </div>

      <div
        class="flex p-1 rounded-lg mb-6 bg-slate-100 border border-slate-200">
        <button
          id="tabLogin" onclick="mostrarForm('login')" class="w-1/2 py-2 text-xs font-bold rounded-md transition bg-[#2CC56A] text-white shadow-sm">
          Iniciar Sesión
        </button>
        <button
          id="tabRegistro" onclick="mostrarForm('registro')" class="w-1/2 py-2 text-xs font-bold rounded-md transition text-slate-500 hover:text-slate-800">
          Crear Cuenta
        </button>
      </div>

      <div
        id="msgAlerta"
        class="hidden mb-4 p-3 rounded-lg text-xs font-semibold text-center"
      ></div>

      <form id="formLogin" onsubmit="ejecutarLogin(event)" class="space-y-4">
        <div>
          <label
            class="block text-xs font-medium text-slate-600 mb-1">Correo Electrónico</label
          >
          <input
            type="email"
            id="loginCorreo"
            required
            placeholder="demo@asir.com"
            class="w-full text-sm rounded-lg p-2.5 bg-white border border-slate-300 text-slate-800 placeholder-slate-400 focus:outline-none focus:border-[#2CC56A] focus:ring-1 focus:ring-[#2CC56A]">
        </div>
        <div>
          <label
            class="block text-xs font-medium text-slate-600 mb-1">Contraseña</label
          >
          <input
            type="password"
            id="loginClave"
            required
            placeholder="••••••••"
            class="w-full text-sm rounded-lg p-2.5 bg-white border border-slate-300 text-slate-800 placeholder-slate-400 focus:outline-none focus:border-[#2CC56A] focus:ring-1 focus:ring-[#2CC56A]">
        </div>
        <button
          type="submit"
          class="w-full font-bold py-2.5 rounded-lg text-sm transition bg-[#2CC56A] hover:bg-[#24a859] text-white shadow-sm">
          Ingresar al Panel
        </button>
      </form>

      <form
        id="formRegistro"
        onsubmit="ejecutarRegistro(event)"
        class="space-y-4 hidden"
      >
        <div>
          <label
            class="block text-xs font-medium text-slate-600 mb-1">Nombre Completo</label
          >
          <input
            type="text"
            id="regNombre"
            required
            placeholder="Juan Pérez"
            class="w-full text-sm rounded-lg p-2.5 bg-white border border-slate-300 text-slate-800 placeholder-slate-400 focus:outline-none focus:border-[#2CC56A] focus:ring-1 focus:ring-[#2CC56A]">
        </div>
        <div>
          <label
            class="block text-xs font-medium text-slate-600 mb-1">Correo Electrónico</label
          >
          <input
            type="email"
            id="regCorreo"
            required
            placeholder="tu@campo.com"
            class="w-full text-sm rounded-lg p-2.5 bg-white border border-slate-300 text-slate-800 placeholder-slate-400 focus:outline-none focus:border-[#2CC56A] focus:ring-1 focus:ring-[#2CC56A]">
        </div>
        <div>
          <label
            class="block text-xs font-medium text-slate-600 mb-1">Contraseña</label
          >
          <input
            type="password"
            id="regClave"
            required
            placeholder="••••••••"
            class="w-full text-sm rounded-lg p-2.5 bg-white border border-slate-300 text-slate-800 placeholder-slate-400 focus:outline-none focus:border-[#2CC56A] focus:ring-1 focus:ring-[#2CC56A]">
        </div>
        <button
          type="submit"
          class="w-full font-bold py-2.5 rounded-lg text-sm transition bg-[#2CC56A] hover:bg-[#24a859] text-white shadow-sm">
          Registrar Mi Cuenta
        </button>
      </form>
    </div>
    <script src="/js/acceso.js"></script>
  </body>
</html>
